services:
  broker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: broker
    volumes:
      - ../src/broker.py:/app/main.py
    ports:
      - 5555:5555
      - 5556:5556

  proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proxy
    restart: unless-stopped
    volumes:
      - ../src/proxy.py:/app/main.py

  reference:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reference
    restart: unless-stopped
    environment:
      HEARTBEAT_TIMEOUT: 30
    volumes:
      - ../src/reference.py:/app/main.py
      - ../src/message_pb2.py:/app/message_pb2.py

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: server
    env_file:
      - .env
    environment:
      SERVER_NAME: server_1
    volumes:
      - ../src/server.py:/app/main.py
      - ../src/message_pb2.py:/app/message_pb2.py
    depends_on:
      broker:
        condition: service_started
      proxy:
        condition: service_started
      reference:
        condition: service_started
      postgres:
        condition: service_healthy
    deploy:
      replicas: 1

  client_pedro:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: client_pedro
    environment:
      BOT_USER: pedro_client
    volumes:
      - ../src/client.py:/app/main.py
      - ../src/message_pb2.py:/app/message_pb2.py
    depends_on:
      - broker
      - server
      - proxy
    deploy:
      replicas: 1

  client_gabriel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: client_gabriel
    environment:
      BOT_USER: gabriel_client
    volumes:
      - ../src/client.py:/app/main.py
      - ../src/message_pb2.py:/app/message_pb2.py
    depends_on:
      - broker
      - server
      - proxy
    deploy:
      replicas: 1

volumes:
  pgdata:
