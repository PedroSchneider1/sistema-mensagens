x-server: &server
  build:
    context: .
    dockerfile: Dockerfile
  depends_on:
    broker:
      condition: service_started
    proxy:
      condition: service_started
    reference:
      condition: service_started

services:
  broker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: broker
    volumes:
      - ../src/broker.py:/app/main.py
    ports:
      - 5555:5555
      - 5556:5556

  proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proxy
    restart: unless-stopped
    volumes:
      - ../src/proxy.py:/app/main.py

  reference:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reference
    restart: unless-stopped
    environment:
      HEARTBEAT_TIMEOUT: 30
    volumes:
      - ../src/reference.py:/app/main.py
      - ../src/message_pb2.py:/app/message_pb2.py

  server_1:
    <<: *server
    container_name: server_1
    environment:
      SERVER_NAME: server_1
      SERVER_ADDRESS: tcp://server_1:5560
    volumes:
      - ../src/server.py:/app/main.py
      - ../src/store.py:/app/store.py
      - ../src/message_pb2.py:/app/message_pb2.py
      - data_1:/data

  server_2:
    <<: *server
    container_name: server_2
    environment:
      SERVER_NAME: server_2
      SERVER_ADDRESS: tcp://server_2:5560
    volumes:
      - ../src/server.py:/app/main.py
      - ../src/store.py:/app/store.py
      - ../src/message_pb2.py:/app/message_pb2.py
      - data_2:/data

  server_3:
    <<: *server
    container_name: server_3
    environment:
      SERVER_NAME: server_3
      SERVER_ADDRESS: tcp://server_3:5560
    volumes:
      - ../src/server.py:/app/main.py
      - ../src/store.py:/app/store.py
      - ../src/message_pb2.py:/app/message_pb2.py
      - data_3:/data

  client_pedro:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: client_pedro
    environment:
      BOT_USER: pedro_client
    volumes:
      - ../src/client.py:/app/main.py
      - ../src/message_pb2.py:/app/message_pb2.py
    depends_on:
      - broker
      - server_1
      - server_2
      - server_3
      - proxy
    deploy:
      replicas: 1

  client_gabriel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: client_gabriel
    environment:
      BOT_USER: gabriel_client
    volumes:
      - ../src/client.py:/app/main.py
      - ../src/message_pb2.py:/app/message_pb2.py
    depends_on:
      - broker
      - server_1
      - server_2
      - server_3
      - proxy
    deploy:
      replicas: 1

volumes:
  data_1:
  data_2:
  data_3:
