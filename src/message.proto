syntax = "proto3";

package message;

import "google/protobuf/timestamp.proto";

// ---------- Envelopes ----------

message Request {
  google.protobuf.Timestamp timestamp = 1;
  int64 clock = 7;   // relógio lógico de quem envia
  oneof payload {
    ConnRequest conn = 2;
    LoginRequest login = 3;
    CreateChannelRequest create_channel = 4;
    ListChannelsRequest list_channels = 5;
    PublishRequest publish = 6;
  }
}

message Response {
  google.protobuf.Timestamp timestamp = 1;
  int64 clock = 8;   // relógio lógico de quem envia
  oneof payload {
    ConnReply conn_reply = 2;
    LoginReply login_reply = 3;
    CreateChannelReply create_channel_reply = 4;
    ErrorReply error = 5;
    ListChannelsReply list_channels_reply = 6;
    PublishReply publish_reply = 7;
  }
}

// ---------- Conexão ----------

message ConnRequest {
  string message = 1;
  google.protobuf.Timestamp timestamp = 2;
}

message ConnReply {
  string message = 1;
  google.protobuf.Timestamp timestamp = 2;
}

// ---------- Login e canais ----------

message LoginRequest {
  string user = 1;
  google.protobuf.Timestamp timestamp = 2;
}

message LoginReply {
  int32 status = 1;   // 200 = ok, 401 = não autorizado
  google.protobuf.Timestamp timestamp = 2;
}

message CreateChannelRequest {
  string name = 1;
  google.protobuf.Timestamp timestamp = 2;
}

message CreateChannelReply {
  int32 status = 1;   // 200 = criado, 409 = já existe
  google.protobuf.Timestamp timestamp = 2;
}

message ListChannelsRequest {
  google.protobuf.Timestamp timestamp = 1;
}

message ListChannelsReply {
  repeated string channels = 1;
  google.protobuf.Timestamp timestamp = 2;
}

// ---------- Publicação ----------

// Requisição do usuário ao servidor (REQ/REP)
message PublishRequest {
  string user = 1;
  string channel = 2;
  string message = 3;
  google.protobuf.Timestamp timestamp = 4;
}

message PublishReply {
  int32 status = 1;   // 200 = publicado, 404 = canal não existe
  google.protobuf.Timestamp timestamp = 2;
}

// Conteúdo entregue aos inscritos (PUB/SUB). O tópico do ZeroMQ é o nome do canal.
message Publication {
  string channel = 1;
  string sender = 2;
  string message = 3;
  google.protobuf.Timestamp timestamp = 4;
  int64 clock = 5;   // relógio lógico de quem envia
}

message ErrorReply {
  string error = 1;
  google.protobuf.Timestamp timestamp = 2;
}

// ---------- Serviço de referência (servidor <-> referência, REQ/REP) ----------

message ReferenceRequest {
  google.protobuf.Timestamp timestamp = 1;
  int64 clock = 2;   // relógio lógico de quem envia
  oneof payload {
    RankRequest rank = 3;
    ServerListRequest list = 4;
    HeartbeatRequest heartbeat = 5;
  }
}

message ReferenceResponse {
  google.protobuf.Timestamp timestamp = 1;   // hora de referência (relógio físico)
  int64 clock = 2;   // relógio lógico de quem envia
  oneof payload {
    RankReply rank_reply = 3;
    ServerListReply list_reply = 4;
    HeartbeatReply heartbeat_reply = 5;
  }
}

message RankRequest {
  string name = 1;
  string address = 2;   // endereço do socket de comunicação entre servidores
}

message RankReply {
  int32 rank = 1;
}

message ServerListRequest {}

message ServerInfo {
  string name = 1;
  int32 rank = 2;
  string address = 3;
}

message ServerListReply {
  repeated ServerInfo servers = 1;
}

message HeartbeatRequest {
  string name = 1;
}

message HeartbeatReply {
  int32 status = 1;   // 200 = ok, 404 = servidor fora da lista (deve pedir o rank de novo)
}

// ---------- Comunicação entre servidores (REQ/REP) ----------

message ServerRequest {
  google.protobuf.Timestamp timestamp = 1;
  int64 clock = 2;   // relógio lógico de quem envia
  oneof payload {
    ClockRequest clock_request = 3;
    ElectionRequest election = 4;
  }
}

message ServerResponse {
  google.protobuf.Timestamp timestamp = 1;   // hora de quem responde (relógio físico)
  int64 clock = 2;   // relógio lógico de quem envia
  oneof payload {
    ClockReply clock_reply = 3;
    ElectionReply election_reply = 4;
  }
}

// Pede a hora ao coordenador; a resposta traz a hora no timestamp do envelope
message ClockRequest {}

message ClockReply {}

message ElectionRequest {
  string name = 1;
  int32 rank = 2;
}

message ElectionReply {
  string status = 1;   // "OK"
}

// Publicado no tópico "servers" pelo servidor eleito coordenador (PUB/SUB)
message CoordinatorAnnouncement {
  string name = 1;
  google.protobuf.Timestamp timestamp = 2;
  int64 clock = 3;   // relógio lógico de quem envia
}
