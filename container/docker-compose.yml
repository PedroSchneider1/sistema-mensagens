x-server: &server
  build:
    context: ..
    dockerfile: container/Dockerfile.java
  depends_on:
    broker:
      condition: service_started
    proxy:
      condition: service_started
    reference:
      condition: service_started

services:
  broker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: broker
    volumes:
      - ../src/broker.py:/app/main.py
    ports:
      - 5555:5555
      - 5556:5556

  proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proxy
    restart: unless-stopped
    volumes:
      - ../src/proxy.py:/app/main.py

  reference:
    build:
      context: ..
      dockerfile: container/Dockerfile.java
    container_name: reference
    command: ["reference"]

  server_1:
    <<: *server
    container_name: server_1
    environment:
      SERVER_NAME: server_1
      SERVER_ADDRESS: tcp://server_1:5560
      DB_PATH: /data/server_1.db
    command: ["server"]
    volumes:
      - data_1:/data

  server_2:
    <<: *server
    container_name: server_2
    environment:
      SERVER_NAME: server_2
      SERVER_ADDRESS: tcp://server_2:5560
      DB_PATH: /data/server_2.db
    command: ["server"]
    volumes:
      - data_2:/data

  server_3:
    <<: *server
    container_name: server_3
    environment:
      SERVER_NAME: server_3
      SERVER_ADDRESS: tcp://server_3:5560
      DB_PATH: /data/server_3.db
    command: ["server"]
    volumes:
      - data_3:/data

  client_pedro:
    build:
      context: ..
      dockerfile: container/Dockerfile.java
    container_name: client_pedro
    environment:
      BOT_USER: pedro_client
    command: ["client"]
    depends_on:
      - broker
      - server_1
      - server_2
      - server_3
      - proxy
    deploy:
      replicas: 1

  client_gabriel:
    build:
      context: ..
      dockerfile: container/Dockerfile.java
    container_name: client_gabriel
    environment:
      BOT_USER: gabriel_client
    command: ["client"]
    depends_on:
      - broker
      - server_1
      - server_2
      - server_3
      - proxy
    deploy:
      replicas: 1

volumes:
  data_1:
  data_2:
  data_3:
