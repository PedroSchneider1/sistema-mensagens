services:
  broker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: broker
    volumes:
      - ../src/broker.py:/app/main.py
    ports:
      - 5555:5555
      - 5556:5556

  proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proxy
    restart: unless-stopped
    volumes:
      - ../src/proxy.py:/app/main.py

  reference:
    build:
      context: ..
      dockerfile: container/Dockerfile.java
    container_name: reference
    command: ["reference"]

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-messaging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-messaging}
      POSTGRES_DB: ${POSTGRES_DB:-messaging}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ..
      dockerfile: container/Dockerfile.java
    container_name: server
    environment:
      SERVER_NAME: server_1
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-messaging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-messaging}
      POSTGRES_DB: ${POSTGRES_DB:-messaging}
    command: ["server"]
    depends_on:
      broker:
        condition: service_started
      proxy:
        condition: service_started
      reference:
        condition: service_started
      postgres:
        condition: service_healthy
    deploy:
      replicas: 1

  client_pedro:
    build:
      context: ..
      dockerfile: container/Dockerfile.java
    container_name: client_pedro
    environment:
      BOT_USER: pedro_client
    command: ["client"]
    depends_on:
      - broker
      - server
      - proxy
    deploy:
      replicas: 1

  client_gabriel:
    build:
      context: ..
      dockerfile: container/Dockerfile.java
    container_name: client_gabriel
    environment:
      BOT_USER: gabriel_client
    command: ["client"]
    depends_on:
      - broker
      - server
      - proxy
    deploy:
      replicas: 1

volumes:
  pgdata:
